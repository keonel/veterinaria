server:
  port: ${PORT:8082}
spring:
  application:
    name: catalogo
  profiles:
    default: h2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  issuer: ${JWT_ISSUER:sanmarcos-usuarios}
  # Dirección donde usuarios publica la clave pública para validar los JWT
  jwks: ${AUTH_JWKS_URL:http://localhost:8081/api/v1/auth/jwks}
  gateway-url: ${GATEWAY_URL:http://localhost:8080}
  # Clave compartida con pedidos para el endpoint interno de ventas
  internal-key: ${INTERNAL_API_KEY:local-cambiar-clave-interna-32-caracteres}
