server:
  port: ${PORT:8084}
spring:
  application:
    name: citas
  profiles:
    default: h2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  issuer: ${JWT_ISSUER:sanmarcos-usuarios}
  jwks: ${AUTH_JWKS_URL:http://localhost:8081/api/v1/auth/jwks}
  gateway-url: ${GATEWAY_URL:http://localhost:8080}
